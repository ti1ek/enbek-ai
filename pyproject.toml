[project]
name = "enbek-ai"
version = "0.1.0"
description = "AI-платформа по трудовому праву Республики Казахстан"
requires-python = ">=3.12"
dependencies = [
    # API & Web
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.35",
    "httpx>=0.27",
    "python-multipart>=0.0.9",

    # LLM & LangChain
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langsmith>=0.1",
    "openai>=1.50",

    # Vector DB
    "qdrant-client[fastembed]>=1.11",
    "fastembed>=0.4",

    # Document Parsing
    "llama-cloud-services>=0.6",

    # Scraping
    "selectolax>=0.3",
    "playwright>=1.45",

    # MCP
    "mcp[cli]>=1.0",

    # Utils
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "cohere>=5.11",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py312"
